project_id = "fitling"

[db]
major_version = 17

[auth]
site_url = "fitling://auth-callback"
# The web address is for the local web tests (D-24); the real project gets the published address only with approval.
additional_redirect_urls = ["fitling://auth-callback", "fitling://reset-password", "http://localhost:4173/fitling/"]

[auth.email]
enable_confirmations = true

# The function checks the user's token itself; the gateway check does not work with the new API keys.
[functions.delete-account]
verify_jwt = false

# Checks the token itself, like delete-account.
[functions.lookup-product]
verify_jwt = false
[functions.sync-offers]
# Called by pg_cron with the secret key, which is no JWT; the function checks the key itself.
verify_jwt = false
