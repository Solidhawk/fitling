name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: FitlingCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    defaults:
      run:
        working-directory: Packages/FitlingCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  backend:
    name: Supabase (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      # Het schema is één bestand (docs/ARCHITECTURE.md, D-07): op een lege database zetten, dan testen.
      - name: Database (schema.sql + pgTAP)
        run: |
          # Poort 54322 ligt in het bereik dat de runner ook voor uitgaande verbindingen gebruikt;
          # heel soms is hij net bezet. Dan stoppen en opnieuw proberen.
          for attempt in 1 2 3; do
            supabase db start && break
            supabase stop --no-backup || true
            sleep 10
          done
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/seed/sport.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/seed/recipes.sql
          supabase test db
      # Het ontwikkelproject wordt bij een schemawijziging leeggemaakt en opnieuw opgezet (TASKS 0.2).
      # Na reset-dev.sql mag er niets van het schema over zijn, anders mist dat bestand een tabel.
      - name: Leegmaken en opnieuw opzetten (reset-dev.sql + schema.sql)
        run: |
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/reset-dev.sql
          left=$(psql "$db" -v ON_ERROR_STOP=1 -tA -c "
            select n.nspname || '.' || c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname in ('public', 'private') and c.relkind in ('r', 'p', 'v', 'm', 'S')
            union all
            select n.nspname || '.' || p.proname || '()' from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname in ('public', 'private')")
          if [ -n "$left" ]; then
            echo "Na reset-dev.sql staat er nog:"
            echo "$left"
            exit 1
          fi
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/seed/sport.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/seed/recipes.sql
          supabase test db
      # De nachtelijke ophaalronde: twee keer draaien moet dezelfde 25 jobs geven (20 ketens, Albert Heijn in
      # 4 delen, Jumbo en PLUS in 2), elk op een eigen tijd.
      - name: Nachtelijke ophaalronde (sync-offers-cron.sql)
        run: |
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$db" -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/sync-offers-cron.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/sync-offers-cron.sql
          got=$(psql "$db" -v ON_ERROR_STOP=1 -tA -c "
            select count(*) || ' ' || count(distinct schedule) || ' '
              || count(*) filter (where command like '%retailer=albert_heijn&part=4''%')
            from cron.job where jobname like 'sync-offers-%'")
          if [ "$got" != "25 25 1" ]; then
            echo "Verwacht 25 jobs op 25 tijden, één voor Albert Heijn deel 4; kreeg: $got"
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            echo "== $dir"
            (cd "$dir" && deno fmt --check && deno check index.ts && deno test --allow-read) || exit 1
          done

  strings:
    name: Teksten en modellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-strings.mjs
      - run: node scripts/check-models.mjs
      - run: node scripts/sport-seed.mjs --check
      - run: node scripts/recipe-seed.mjs --check
      - name: Houdingen van de geanimeerde oefeningen
        run: python3 -m unittest discover -s design/oefeningen/3d

  ios:
    name: iOS (simulator)
    # Mac minutes are limited: only on main, on demand, or when a commit message asks with [ios].
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ios]')
    needs: [core, strings]
    runs-on: macos-15
    # Bouwen plus de UI-tests in drie standen duurt op een trage runner bijna een half uur.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          # Fixed, so a runner image update cannot change the compiler under us.
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head -20
      - run: brew install xcodegen
      - name: Supabase-config uit secrets
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: printf 'SUPABASE_HOST = %s\nSUPABASE_PUBLISHABLE_KEY = %s\n' "$SUPABASE_HOST" "$SUPABASE_PUBLISHABLE_KEY" > Config/Supabase.xcconfig
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
      - run: xcodegen generate
      - name: Bouwen en testen
        run: |
          set +e
          xcodebuild test -scheme Fitling \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          status=$?
          # Every failure first: the last 150 lines of a long run leave most of them out.
          grep -E "✘|Test Case .* failed|\.swift:[0-9]+:.* error:" xcodebuild.log | cut -c1-400
          grep -E "error:|Test Suite|Test Case .*(passed|failed)|✔|✘|\*\* (TEST|BUILD)" xcodebuild.log | tail -150
          exit $status
      - name: Screenshots uit de UI-test
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore
