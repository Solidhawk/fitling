name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: FitlingCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    defaults:
      run:
        working-directory: Packages/FitlingCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test
