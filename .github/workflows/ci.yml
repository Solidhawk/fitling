name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: FitlingCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    defaults:
      run:
        working-directory: Packages/FitlingCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  backend:
    name: Supabase (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Database (migraties + pgTAP)
        run: |
          supabase db start
          supabase test db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Edge Function delete-account
        working-directory: supabase/functions/delete-account
        run: |
          deno fmt --check
          deno check index.ts
          deno test
