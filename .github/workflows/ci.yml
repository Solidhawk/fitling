name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Een nieuwe push op een branch stopt de vorige run; op main wacht hij, zodat het publiceren van de site nooit halverwege
  # wordt afgebroken (S36).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: FitlingCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    defaults:
      run:
        working-directory: Packages/FitlingCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  web-core:
    name: Web (rekenregels)
    runs-on: ubuntu-latest
    # Vast op 6.4.3: de Swift SDK voor WebAssembly moet precies bij de compiler horen.
    container: swift:6.4.3
    steps:
      - uses: actions/checkout@v4
      - name: Rekenregels voor het web (Swift)
        working-directory: web/core
        run: swift test
      # Zelf downloaden: de downloader van `swift sdk install` crasht in deze container (run 45395292745).
      - name: Swift SDK voor WebAssembly
        run: |
          command -v curl >/dev/null || (apt-get update && apt-get install -y curl)
          curl -fsSL -o /tmp/wasm-sdk.artifactbundle.tar.gz https://download.swift.org/swift-6.4.3-release/wasm-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_wasm.artifactbundle.tar.gz
          echo "5f24408dc9737ce4cb23b7e3ed4306cabfa02cc02f22ab260b14579b955d4b12  /tmp/wasm-sdk.artifactbundle.tar.gz" | sha256sum -c -
          swift sdk install /tmp/wasm-sdk.artifactbundle.tar.gz
          swift sdk list
      - name: Rekenregels als WebAssembly
        working-directory: web/core
        run: |
          swift build --swift-sdk swift-6.4.3-RELEASE_wasm -c release --product fitling-core -Xswiftc -Xclang-linker -Xswiftc -mexec-model=reactor -Xswiftc -Osize -Xswiftc -gnone -Xlinker --strip-all
          mkdir -p ../public
          cp "$(swift build --swift-sdk swift-6.4.3-RELEASE_wasm -c release --show-bin-path)/fitling-core.wasm" ../public/fitling-core.wasm
          gzip -9 -k -f ../public/fitling-core.wasm
          ls -l ../public/fitling-core.wasm ../public/fitling-core.wasm.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fitling-core-wasm
          path: web/public/fitling-core.wasm*

  # Op Ubuntu 24.04: de Swift-container en ubuntu-latest draaien 26.04, waar Playwright 1.53 geen browsers voor had. Met
  # Playwright 1.65 (S51) draait WebKit 27.2 hier zonder fouten; een andere Ubuntu is niet geprobeerd.
  web:
    name: Web
    needs: web-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fitling-core-wasm
          path: web/public
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Een lokale Supabase met het schema, zodat inloggen en opslaan echt getest worden; nooit het echte project.
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Lokale Supabase voor de webtests
        run: |
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,postgres-meta,supavisor && break
            supabase stop --no-backup || true
            sleep 10
          done
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/web-push.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/submit-product.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/seed/sport.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/seed/recipes.sql
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          # Only for the browser tests, to make test users: the fixed development key of this local Supabase.
          echo "LOCAL_SUPABASE_SERVICE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
      - name: Webapp testen
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Webapp bouwen
        working-directory: web
        env:
          # The public key of the example in RFC 8291, so the build has the reminders section; the browser tests fake
          # the push service (reminders.spec.ts). Not the project's key: that one is the GitHub variable below.
          VITE_VAPID_PUBLIC_KEY: BP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A8
        run: npm run build
      - name: Webapp in Safari (WebKit) en Chrome
        working-directory: web
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/test-results/
          if-no-files-found: ignore
      # Alleen main gaat live, op https://solidhawk.github.io/fitling/ (D-24). De geteste bouw praat met de lokale
      # Supabase van deze job; de site wordt opnieuw gebouwd tegen het echte project, uit de GitHub-variabelen (S34).
      - name: Webapp bouwen voor de site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          # Optional (docs/web-push.md): without it the site has no reminders.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Zet de GitHub-variabelen SUPABASE_URL en SUPABASE_PUBLISHABLE_KEY (S34) voordat de site live gaat."
            exit 1
          fi
          npm run build
          # Het ruwe bestand staat in public/ voor de tests; de app laadt alleen fitling-core.wasm.gz (S36).
          rm -f dist/fitling-core.wasm
          test ! -e dist/fitling-core.wasm
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  pages:
    name: Web publiceren
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  backend:
    name: Supabase (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      # Het schema is één bestand (docs/ARCHITECTURE.md, D-07): op een lege database zetten, dan testen.
      - name: Database (schema.sql + pgTAP)
        run: |
          # Poort 54322 ligt in het bereik dat de runner ook voor uitgaande verbindingen gebruikt;
          # heel soms is hij net bezet. Dan stoppen en opnieuw proberen.
          for attempt in 1 2 3; do
            supabase db start && break
            supabase stop --no-backup || true
            sleep 10
          done
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/web-push.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/submit-product.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/seed/sport.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/seed/recipes.sql
          # De NEVO-import met verzonnen producten (scripts/fixtures/nevo-test.csv), want de echte tabel staat niet in
          # git: twee keer, dan zonder het laatste product (supabase/tests/nevo_import_test.sql).
          node scripts/nevo-import.mjs scripts/fixtures/nevo-test.csv /tmp/nevo.sql
          head -n 3 scripts/fixtures/nevo-test.csv > /tmp/nevo-kleiner.csv
          node scripts/nevo-import.mjs /tmp/nevo-kleiner.csv /tmp/nevo-kleiner.sql
          for file in /tmp/nevo.sql /tmp/nevo.sql /tmp/nevo-kleiner.sql; do
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$file"
          done
          supabase test db
      # Het ontwikkelproject wordt bij een schemawijziging leeggemaakt en opnieuw opgezet (TASKS 0.2).
      # Na reset-dev.sql mag er niets van het schema over zijn, anders mist dat bestand een tabel.
      - name: Leegmaken en opnieuw opzetten (reset-dev.sql + schema.sql)
        run: |
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/reset-dev.sql
          left=$(psql "$db" -v ON_ERROR_STOP=1 -tA -c "
            select n.nspname || '.' || c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname in ('public', 'private') and c.relkind in ('r', 'p', 'v', 'm', 'S')
            union all
            select n.nspname || '.' || p.proname || '()' from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname in ('public', 'private')")
          if [ -n "$left" ]; then
            echo "Na reset-dev.sql staat er nog:"
            echo "$left"
            exit 1
          fi
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          # Twee keer: op een project dat al draait, kan het opnieuw (docs/web-push.md).
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/web-push.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/submit-product.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/web-push.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/submit-product.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/seed/sport.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -f supabase/seed/recipes.sql
          for file in /tmp/nevo.sql /tmp/nevo.sql /tmp/nevo-kleiner.sql; do
            psql "$db" -v ON_ERROR_STOP=1 -q -f "$file"
          done
          supabase test db
      # De nachtelijke ophaalronde: twee keer draaien moet dezelfde 25 jobs geven (20 ketens, Albert Heijn in
      # 4 delen, Jumbo en PLUS in 2), elk op een eigen tijd.
      - name: Nachtelijke ophaalronde (sync-offers-cron.sql)
        run: |
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$db" -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/sync-offers-cron.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/sync-offers-cron.sql
          got=$(psql "$db" -v ON_ERROR_STOP=1 -tA -c "
            select count(*) || ' ' || count(distinct schedule) || ' '
              || count(*) filter (where command like '%retailer=albert_heijn&part=4''%')
            from cron.job where jobname like 'sync-offers-%'")
          if [ "$got" != "25 25 1" ]; then
            echo "Verwacht 25 jobs op 25 tijden, één voor Albert Heijn deel 4; kreeg: $got"
            exit 1
          fi
      # De herinneringen van de webversie (fase 7): twee keer draaien geeft één job, elke minuut. De opdracht
      # zelf moet ook kloppen; zonder herinnering die klaarstaat, roept hij niets aan.
      - name: Herinneringen versturen (send-reminders-cron.sql)
        run: |
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$db" -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/send-reminders-cron.sql
          psql "$db" -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/send-reminders-cron.sql
          got=$(psql "$db" -v ON_ERROR_STOP=1 -tA -c "
            select count(*) || ' ' || min(schedule) from cron.job where jobname = 'send-reminders'")
          if [ "$got" != "1 * * * * *" ]; then
            echo "Verwacht één job, elke minuut; kreeg: $got"
            exit 1
          fi
          command=$(psql "$db" -v ON_ERROR_STOP=1 -tA -c "select command from cron.job where jobname = 'send-reminders'")
          psql "$db" -v ON_ERROR_STOP=1 -q -o /dev/null -c "$command"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            echo "== $dir"
            (cd "$dir" && deno fmt --check && deno check index.ts && deno test --allow-read) || exit 1
          done

  strings:
    name: Teksten en modellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-strings.mjs
      - run: node scripts/check-models.mjs
      - run: node scripts/sport-seed.mjs --check
      - run: node scripts/recipe-seed.mjs --check
      - name: Houdingen van de geanimeerde oefeningen
        run: python3 -m unittest discover -s design/oefeningen/3d

  ios:
    name: iOS (simulator)
    # Mac minutes are limited: only on main, on demand, or when a commit message asks with [ios].
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ios]')
    needs: [core, strings]
    runs-on: macos-15
    # Bouwen plus de UI-tests in drie standen duurt op een trage runner bijna een half uur.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          # Fixed, so a runner image update cannot change the compiler under us.
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head -20
      - run: brew install xcodegen
      - name: Supabase-config uit secrets
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: printf 'SUPABASE_HOST = %s\nSUPABASE_PUBLISHABLE_KEY = %s\n' "$SUPABASE_HOST" "$SUPABASE_PUBLISHABLE_KEY" > Config/Supabase.xcconfig
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
      - run: xcodegen generate
      - name: Bouwen en testen
        run: |
          set +e
          xcodebuild test -scheme Fitling \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          status=$?
          # Every failure first: the last 150 lines of a long run leave most of them out.
          grep -E "✘|Test Case .* failed|\.swift:[0-9]+:.* error:" xcodebuild.log | cut -c1-400
          grep -E "error:|Test Suite|Test Case .*(passed|failed)|✔|✘|\*\* (TEST|BUILD)" xcodebuild.log | tail -150
          exit $status
      - name: Screenshots uit de UI-test
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore
