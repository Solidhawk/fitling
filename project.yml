name: Fitling
options:
  bundleIdPrefix: nl.fitling
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  FitlingCore:
    path: Packages/FitlingCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.7
targets:
  Fitling:
    type: application
    platform: iOS
    sources:
      - Fitling
    info:
      path: Fitling/Info.plist
      properties:
        CFBundleDisplayName: Fitling
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl, en, de]
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: nl.fitling.Fitling
            CFBundleURLSchemes: [fitling]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Translated in Fitling/Resources/InfoPlist.xcstrings.
        NSCameraUsageDescription: Fitling gebruikt de camera om de barcode en het etiket van een product te lezen.
        NSHealthShareUsageDescription: Fitling leest je trainingen uit Apple Health, zodat ze meetellen in je dagdoel. Er gaat niets naar onze server.
        SupabaseHost: $(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
    entitlements:
      path: Fitling/Resources/Fitling.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: FitlingCore
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.fitling.Fitling
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Drawn by design/icoon/maak_icoon.py, in light, dark and tinted (UNFORGET S37).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  FitlingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FitlingTests
    dependencies:
      - target: Fitling
      - package: FitlingCore
      - package: Supabase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.fitling.FitlingTests
  FitlingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FitlingUITests
    dependencies:
      - target: Fitling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.fitling.FitlingUITests
schemes:
  Fitling:
    build:
      targets:
        Fitling: all
    test:
      config: Debug
      targets:
        - FitlingTests
        - FitlingUITests
